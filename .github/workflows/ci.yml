name: CI

on:
  push:
  pull_request:

jobs:
  scaffold-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify architecture documents
        run: test -f README.md && test -f docs/architecture.md && test -f docs/roadmap.md

  implementation-placeholder:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Implementation checks will be enabled when Cursor adds the application and tests."
