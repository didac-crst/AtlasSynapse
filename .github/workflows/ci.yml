name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: semantic_memory
          POSTGRES_USER: semantic_memory
          POSTGRES_PASSWORD: semantic_memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U semantic_memory -d semantic_memory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://semantic_memory:semantic_memory@localhost:5432/semantic_memory

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check src tests migrations

      - name: Ruff lint
        run: ruff check src tests migrations

      - name: Type check
        run: mypy src

      - name: Tests
        run: pytest -q

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify architecture documents
        run: test -f README.md && test -f docs/architecture.md && test -f docs/roadmap.md
