# Local / compose-based deployment.
# Copy .env.example to .env and replace development secrets before any shared use.
#
# Compose services always reach Postgres via hostname "postgres", built from
# POSTGRES_* (not host-side DATABASE_URL, which uses localhost for local tools).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-semantic_memory}
      POSTGRES_USER: ${POSTGRES_USER:-semantic_memory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-semantic_memory}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-semantic_memory} -d ${POSTGRES_DB:-semantic_memory}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-semantic_memory}:${POSTGRES_PASSWORD:-semantic_memory}@postgres:5432/${POSTGRES_DB:-semantic_memory}
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["api"]
    environment:
      APP_NAME: ${APP_NAME:-AtlasSynapse}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-semantic_memory}:${POSTGRES_PASSWORD:-semantic_memory}@postgres:5432/${POSTGRES_DB:-semantic_memory}
      RAW_PAYLOAD_RETENTION: ${RAW_PAYLOAD_RETENTION:-redacted}
      SEMANTIC_REVIEW_MODE: ${SEMANTIC_REVIEW_MODE:-disabled}
      HTTP_HOST: ${HTTP_HOST:-0.0.0.0}
      HTTP_PORT: ${HTTP_PORT:-8000}
      HTTP_API_TOKEN: ${HTTP_API_TOKEN:-}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
    ports:
      - "${HTTP_PORT:-8000}:${HTTP_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:$${HTTP_PORT:-8000}/health/live >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  # Optional stdio MCP sidecar for local agent wiring.
  # Pipe-based stdin/stdout only; do not allocate a TTY because MCP stdio expects
  # clean protocol messages on stdin/stdout.
  mcp:
    profiles: ["mcp"]
    build: .
    command: ["mcp"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-semantic_memory}:${POSTGRES_PASSWORD:-semantic_memory}@postgres:5432/${POSTGRES_DB:-semantic_memory}
      MCP_TRANSPORT: stdio
      SEMANTIC_REVIEW_MODE: ${SEMANTIC_REVIEW_MODE:-disabled}
      HTTP_API_TOKEN: ${HTTP_API_TOKEN:-}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stdin_open: true
    tty: false

volumes:
  postgres-data:
