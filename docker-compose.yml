services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: semantic_memory
      POSTGRES_USER: semantic_memory
      POSTGRES_PASSWORD: semantic_memory
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semantic_memory -d semantic_memory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
